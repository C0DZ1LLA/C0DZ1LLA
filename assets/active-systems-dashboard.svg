  <rect x="10" y="10" width="1080" height="500" rx="28" fill="#050505"/>
  <rect x="10" y="10" width="1080" height="500" rx="28" stroke="#d4af37" opacity=".75"/>
  <g opacity=".18"><path d="M70 92H1030M70 246H1030M70 400H1030" stroke="#d4af37" stroke-dasharray="3 12"/><path d="M366 70V455M734 70V455" stroke="#d4af37" stroke-dasharray="3 12"/></g>
  <text x="70" y="65" class="label">C0DZ1LLA OPERATIONS MAP</text><text x="70" y="100" class="title">ACTIVE SYSTEMS</text>
  <g transform="translate(70 130)"><rect width="300" height="118" rx="18" fill="#0a0a0a" stroke="#d4af37"/><circle class="pulse" cx="270" cy="28" r="6" fill="#d4af37"/><text x="24" y="34" class="label">AI PRODUCT</text><text x="24" y="63" class="name">AION Code Oracle</text><text x="24" y="88" class="body">Audit engine for sites, code, launch readiness,</text><text x="24" y="106" class="body">business checks, and product reports.</text></g>
  <g transform="translate(400 130)"><rect width="300" height="118" rx="18" fill="#0a0a0a" stroke="#d4af37"/><circle class="pulse" style="animation-delay:.2s" cx="270" cy="28" r="6" fill="#d4af37"/><text x="24" y="34" class="label">EVENT ENGINE</text><text x="24" y="63" class="name">AION Drops Events</text><text x="24" y="88" class="body">Map-first discovery for local drops, venues,</text><text x="24" y="106" class="body">social signals, and experience layers.</text></g>
  <g transform="translate(730 130)"><rect width="300" height="118" rx="18" fill="#0a0a0a" stroke="#d4af37"/><circle class="pulse" style="animation-delay:.4s" cx="270" cy="28" r="6" fill="#d4af37"/><text x="24" y="34" class="label">SCRIPTURE GRAPH</text><text x="24" y="63" class="name">Tree of Life Explorer</text><text x="24" y="88" class="body">Verse graph, cross references, audio,</text><text x="24" y="106" class="body">visual navigation, and study interface.</text></g>
