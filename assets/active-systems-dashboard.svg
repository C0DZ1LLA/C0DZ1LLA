<svg width="1100" height="520" viewBox="0 0 1100 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Active systems dashboard">
  <style>
    .title{fill:#f8f5ee;font-family:Verdana,Arial,sans-serif;font-size:28px;font-weight:800;letter-spacing:8px}.label{fill:#d4af37;font-family:Verdana,Arial,sans-serif;font-size:10px;font-weight:800;letter-spacing:2.5px}.name{fill:#f8f5ee;font-family:Verdana,Arial,sans-serif;font-size:18px;font-weight:800;letter-spacing:1px}.body{fill:#cfc7aa;font-family:Verdana,Arial,sans-serif;font-size:12px}.tag{fill:#050505;font-family:Verdana,Arial,sans-serif;font-size:10px;font-weight:800;letter-spacing:1px}.pulse{animation:p 2.8s ease-in-out infinite}@keyframes p{0%,100%{opacity:.38}50%{opacity:1}}
