  <style>
    .mono{font-family:'Courier New',monospace}.line{fill:#f8f5ee;font-size:19px}.gold{fill:#d4af37}.muted{fill:#9d9278}.scan{animation:scan 4s linear infinite}@keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(310px)}}.blink{animation:blink 1s steps(2,end) infinite}@keyframes blink{50%{opacity:.1}}
